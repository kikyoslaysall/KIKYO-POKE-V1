name: KIKYO POKE V1 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q KIKYO_POKE_V1_ONLINE_STARTER.zip -d extracted
          BUILD_DIR=$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)

          if [ -z "$BUILD_DIR" ]; then
            echo "Android project not found!"
            exit 1
          fi

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$BUILD_DIR" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KIKYO-POKE-V1-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
